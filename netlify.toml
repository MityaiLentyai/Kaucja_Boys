# ==============================================================================
# Build Settings
# ==============================================================================
[build]
  # Path to your Next.js frontend directory inside the monorepo
  base    = "frontend"  
  command = "npm run build"
  publish = ".next"

[[redirects]]
  from   = "/api/*"
  to     = "https://your-backend-name.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200